AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  PartyBox - Lightsail 1台 + Caddy(自動HTTPS) で公開する構成。
  ルーム状態をメモリとディスクに持つため、インスタンスは1台で運用します。
  EC2 版（deploy/aws）より安く、転送量も込みです。

Parameters:
  BundleId:
    Type: String
    Default: micro_3_0
    AllowedValues: [nano_3_0, micro_3_0, small_3_0]
    Description: >-
      Lightsail のプラン。micro_3_0 = 2vCPU / 1GB / SSD 40GB / 転送 2TB で月 7 USD。
      nano_3_0 は RAM 0.5GB でサーバー内のビルドが厳しいので、基本は micro 以上
  AvailabilityZone:
    Type: String
    Default: ap-northeast-1a
    Description: 置く AZ
  GitRepoUrl:
    Type: String
    Default: https://github.com/mizuki-majima/PartyBox.git
    Description: 公開リポジトリのURL
  GitBranch:
    Type: String
    Default: main
    Description: デプロイするブランチ
  DomainName:
    Type: String
    Default: ''
    Description: >-
      独自ドメイン（任意）。空なら <IP>.sslip.io の自動ドメインで HTTPS 化します。
      独自ドメインを使う場合は、作成後に出力の StaticIp へ A レコードを向けてください

Resources:
  # 固定IP。インスタンスとは別に作り、作成後に attach する
  # （UserData が IP を参照すると循環参照になるため、IP は起動時に自分で調べる作りにしている）
  StaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: partybox-ip

  Instance:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: partybox
      BlueprintId: amazon_linux_2023
      BundleId: !Ref BundleId
      AvailabilityZone: !Ref AvailabilityZone
      Tags:
        - Key: Project
          Value: PartyBox
      Networking:
        Ports:
          # 公開するのは 80・443 だけ。22 は Lightsail コンソールのブラウザSSH用（鍵認証のみ）
          - { FromPort: 80, ToPort: 80, Protocol: tcp, Cidrs: ['0.0.0.0/0'] }
          - { FromPort: 443, ToPort: 443, Protocol: tcp, Cidrs: ['0.0.0.0/0'] }
          - { FromPort: 443, ToPort: 443, Protocol: udp, Cidrs: ['0.0.0.0/0'] }
          - { FromPort: 22, ToPort: 22, Protocol: tcp, Cidrs: ['0.0.0.0/0'] }
      UserData: !Sub |
        #!/bin/bash
        set -euxo pipefail
        exec > /var/log/partybox-setup.log 2>&1

        # ビルド時のメモリ不足対策として 2GB のスワップ（micro は RAM 1GB）
        if [ ! -f /swapfile ]; then
          dd if=/dev/zero of=/swapfile bs=1M count=2048
          chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab
        fi

        dnf install -y docker git
        systemctl enable --now docker

        # state     … 懇親会のルームの保存先。消すと進行が失われる
        # event-data … 名簿・クイズの問題（リポジトリには置かない）
        mkdir -p /opt/partybox /opt/partybox/state /opt/partybox/event-data
        cat > /opt/partybox/env <<'ENVEOF'
        REPO_URL=${GitRepoUrl}
        BRANCH=${GitBranch}
        DOMAIN=${DomainName}
        ENVEOF

        # 更新用スクリプト（最新コードを取得して再ビルド・再起動）
        # 公開IPは実行のたびに調べ直すので、固定IPを付け替えたあとに流し直せば追随する
        cat > /opt/partybox/deploy.sh <<'DEPLOYEOF'
        #!/bin/bash
        set -euxo pipefail
        source /opt/partybox/env
        cd /opt/partybox

        if [ -n "$DOMAIN" ]; then
          SITE_HOST="$DOMAIN"
        else
          TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60" || true)
          IP=$(curl -s -H "X-aws-ec2-metadata-token: $TOKEN" http://169.254.169.254/latest/meta-data/public-ipv4 || true)
          if [ -z "$IP" ]; then IP=$(curl -s https://checkip.amazonaws.com | tr -d '\n'); fi
          SITE_HOST="$(echo "$IP" | tr '.' '-').sslip.io"
        fi
        echo "SITE_HOST=$SITE_HOST"

        if [ -d src/.git ]; then
          git -C src fetch --depth 1 origin "$BRANCH"
          git -C src reset --hard FETCH_HEAD
        else
          git clone --depth 1 --branch "$BRANCH" "$REPO_URL" src
        fi
        docker build -t partybox:latest src
        docker network inspect partybox >/dev/null 2>&1 || docker network create partybox

        mkdir -p /opt/partybox/state /opt/partybox/event-data
        docker rm -f partybox >/dev/null 2>&1 || true
        docker run -d --name partybox --network partybox --restart unless-stopped \
          -e NODE_ENV=production -e PORT=3001 \
          -e PARTYBOX_STATE_DIR=/state -e PARTYBOX_EVENT_DATA_DIR=/event-data \
          -v /opt/partybox/state:/state \
          -v /opt/partybox/event-data:/event-data:ro \
          partybox:latest

        cat > /opt/partybox/Caddyfile <<CADDYEOF
        $SITE_HOST {
          encode gzip
          reverse_proxy partybox:3001
        }
        CADDYEOF
        # IP が変わっていても確実に反映するため、Caddy は作り直す
        # （証明書は caddy_data に残るので取り直しにはならない）
        docker rm -f caddy >/dev/null 2>&1 || true
        docker run -d --name caddy --network partybox --restart unless-stopped \
          -p 80:80 -p 443:443 -p 443:443/udp \
          -v /opt/partybox/Caddyfile:/etc/caddy/Caddyfile:ro \
          -v caddy_data:/data -v caddy_config:/config public.ecr.aws/docker/library/caddy:2
        docker image prune -f
        DEPLOYEOF
        chmod +x /opt/partybox/deploy.sh
        /opt/partybox/deploy.sh

Outputs:
  StaticIp:
    Description: 固定IP（作成後に partybox へ attach してください。独自ドメインならここへ A レコード）
    Value: !GetAtt StaticIp.IpAddress
  Url:
    Description: PartyBox の URL（固定IPを attach して deploy.sh を流し直したあとの値）
    Value: !If
      - UseCustomDomain
      - !Sub 'https://${DomainName}'
      - !Join ['', ['https://', !Join ['-', !Split ['.', !GetAtt StaticIp.IpAddress]], '.sslip.io']]
  InstanceName:
    Description: Lightsail のインスタンス名
    Value: partybox

Conditions:
  UseCustomDomain: !Not [!Equals [!Ref DomainName, '']]
